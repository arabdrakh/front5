<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 5</title>
    <style>
        body {
            max-width: 500px;
            margin: 40px auto;
            padding: 0 20px;
        }

        input {
            padding: 8px;
            margin-right: 5px;
            margin-bottom: 10px;
        }

        button {
            padding: 8px 12px;
        }

        ul {
            padding-left: 20px;
        }

        li {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <h2>User Profile</h2>

    <form id="profileForm">
        <input type="text" id="username" placeholder="Username">
        <input type="number" id="birthYear" placeholder="Birth Year">
        <button type="submit">Update profile</button>
    </form>

    <h2>Hobbies</h2>

    <ul id="hobbyList">
        <li>Reading</li>
        <li>Painting</li>
        <li>Gaming</li>
    </ul>

    <input type="text" id="itemInput" placeholder="New hobby">
    <button id="addBtn">Add Item</button>
    <button id="removeBtn">Remove Item</button>

    <script>
        const userProfile = {
            name: "Aruzhan",
            birthYear: 2008,
            isDeveloper: true,
            hobbies: ["Reading", "Painting", "Gaming"]
        };

        const currentYear = new Date().getFullYear();
        const age = currentYear - userProfile.birthYear;
        const ageInMonths = age * 12;
        const totalHobbies = userProfile.hobbies.length;

        console.log("Name:", userProfile.name);
        console.log("Age:", age);
        console.log("Age in months:", ageInMonths);
        console.log("Total hobbies:", totalHobbies);

        document.getElementById("profileForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const nameInput = document.getElementById("username").value;
            const birthYearInput = document.getElementById("birthYear").value;

            if (nameInput) {
                userProfile.name = nameInput;
            }
            if (birthYearInput) {
                userProfile.birthYear = Number(birthYearInput);
            }

            console.log("Updated Profile:", userProfile);
        });

        document.getElementById("addBtn").addEventListener("click", function() {
            const input = document.getElementById("itemInput");
            const itemText = input.value.trim();

            if (itemText !== "") {
                const li = document.createElement("li");
                li.textContent = itemText;
                document.getElementById("hobbyList").appendChild(li);
                input.value = "";
            }
        });

        document.getElementById("removeBtn").addEventListener("click", function() {
            const list = document.getElementById("hobbyList");
            if (list.lastElementChild) {
                list.lastElementChild.remove();
            }
        });
    </script>

</body>
</html>
