<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 5</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 40px auto;
            padding: 0 20px;
        }

        input {
            padding: 8px;
            margin-right: 5px;
            margin-bottom: 10px;
        }

        button {
            padding: 8px 12px;
            cursor: pointer;
        }

        ul {
            padding-left: 20px;
        }

        li {
            margin-bottom: 5px;
            cursor: pointer;
        }

        #profileDisplay {
            padding: 10px;
            background-color: #f4f4f4;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h2>User Profile</h2>

    <p id="profileDisplay"></p>

    <form id="profileForm">
        <input type="text" id="username" placeholder="Username">
        <input type="number" id="birthYear" placeholder="Birth Year">
        <button type="submit">Update profile</button>
    </form>

    <h2>Hobbies</h2>

    <ul id="hobbyList">
        <li>Reading</li>
        <li>Painting</li>
        <li>Gaming</li>
    </ul>

    <input type="text" id="itemInput" placeholder="New hobby">
    <button id="addBtn">Add Item</button>
    <button id="removeBtn">Remove Item</button>

    <script>
        const userProfile = {
            name: "Aruzhan",
            birthYear: 2008,
            isDeveloper: true,
            hobbies: ["Reading", "Painting", "Gaming"]
        };

        const currentYear = new Date().getFullYear();
        let age = currentYear - userProfile.birthYear;
        let ageInMonths = age * 12;
        let totalHobbies = userProfile.hobbies.length;

        console.log("Name:", userProfile.name);
        console.log("Age:", age);
        console.log("Age in months:", ageInMonths);
        console.log("Total hobbies:", totalHobbies);

        const profileDisplay = document.getElementById("profileDisplay");
        profileDisplay.textContent = "Name: " + userProfile.name + " Age: " + age + " (" + ageInMonths + " months) Hobbies: " + totalHobbies;

        document.getElementById("profileForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const nameInput = document.getElementById("username").value;
            const birthYearInput = document.getElementById("birthYear").value;
        
            if (nameInput) {
                userProfile.name = nameInput;
            }
            if (birthYearInput) {
                userProfile.birthYear = Number(birthYearInput);
            }

            age = currentYear - userProfile.birthYear;
            ageInMonths = age * 12;

            profileDisplay.textContent = "Name: " + userProfile.name + "  Age: " + age + " (" + ageInMonths + " months)  Hobbies: " + totalHobbies;
            profileDisplay.style.color = "hotpink";

            console.log("Updated Profile:", userProfile);
        });

        document.getElementById("addBtn").addEventListener("click", function() {
            const input = document.getElementById("itemInput");
            const itemText = input.value.trim();

            if (itemText !== "") {
                const li = document.createElement("li");
                li.textContent = itemText;
                document.getElementById("hobbyList").appendChild(li);
                input.value = "";

                userProfile.hobbies.push(itemText);
                totalHobbies = userProfile.hobbies.length;
                profileDisplay.textContent = "Name: " + userProfile.name + "  Age: " + age + " (" + ageInMonths + " months)  Hobbies: " + totalHobbies;
            }
        });

        document.getElementById("removeBtn").addEventListener("click", function() {
            const list = document.getElementById("hobbyList");
            if (list.lastElementChild) {
                list.lastElementChild.remove();

                userProfile.hobbies.pop();
                totalHobbies = userProfile.hobbies.length;
                profileDisplay.textContent = "Name: " + userProfile.name + "  Age: " + age + " (" + ageInMonths + " months)  Hobbies: " + totalHobbies;
            }
        });

        document.getElementById("hobbyList").addEventListener("click", function(event) {
            if (event.target.tagName === "LI") {
                if (event.target.style.textDecoration === "line-through") {
                    event.target.style.textDecoration = "none";
                    event.target.style.color = "black";
                } else {
                    event.target.style.textDecoration = "line-through";
                    event.target.style.color = "gray";
                }
            }
        });
    </script>

</body>
</html>
